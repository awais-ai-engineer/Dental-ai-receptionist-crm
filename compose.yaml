services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aves
      POSTGRES_USER: aves
      POSTGRES_PASSWORD: aves_dev_password
    ports:
      - "127.0.0.1:${AVES_DB_PORT:-5432}:5432"
    volumes:
      - aves_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aves -d aves"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aves_postgres_data:
